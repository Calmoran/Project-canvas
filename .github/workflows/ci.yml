# Canvas CI: every pull request and every push to main runs the same checks
# on Linux and Windows, on Node 24 and 26 (stack research, "Node baseline").
# Windows is in the matrix because Canvas is Windows-first.
#
# Branch protection requires one check, `ci`, which passes only when every
# matrix job passed. Its name stays the same when the matrix changes.
#
# Actions are pinned to a full commit hash (the tag is in the comment): a
# tag can be moved to different code later, a commit hash cannot.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  linux:
    name: ubuntu-latest / Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    # A MySQL 8 server next to the tests, loaded with Canvas's own fixture
    # schema by the tests themselves (architecture section 11).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: canvas-ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pcanvas-ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CANVAS_TEST_MYSQL_URL: mysql://root:canvas-ci@127.0.0.1:3306
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:pins
      - run: pnpm check:deps
      - run: pnpm test
      - run: pnpm -r build

  windows:
    name: windows-latest / Node ${{ matrix.node }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [24, 26]
    # No MySQL here: GitHub's Windows runners cannot run service
    # containers, so the MySQL tests report as skipped.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:pins
      - run: pnpm check:deps
      - run: pnpm test
      - run: pnpm -r build

  ci:
    name: ci
    needs: [linux, windows]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every matrix job passed
        run: |
          echo "linux: ${{ needs.linux.result }}, windows: ${{ needs.windows.result }}"
          test "${{ needs.linux.result }}" = success
          test "${{ needs.windows.result }}" = success
